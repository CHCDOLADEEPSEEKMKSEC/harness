<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHC HARNESS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0817">
<style>
:root{--bg:#0d0817;--fg:#f2eefa;--dim:#a99cc4;--gold:#e8b44a;--line:#2a2140;--green:#5fd39a;--red:#e8506a}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0;color:var(--gold);letter-spacing:.06em}
main{padding:14px 16px 100px;max-width:760px;margin:0 auto}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#151026}
.dim{color:var(--dim);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:6px 0 0;max-height:200px;overflow:auto}
.msg{padding:8px 0;border-bottom:1px solid #221a38}
.msg .w{color:var(--gold);font-size:12px;font-weight:700}
.msg .t{white-space:pre-wrap}
form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#120c22;border-top:1px solid var(--line)}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:#1b1330;color:var(--fg)}
input{flex:1}
button{background:var(--gold);color:#1a1200;font-weight:700;border:0}
a{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid a{display:block;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;text-decoration:none;font-size:14px}
</style></head><body>
<header><h1>CHC HARNESS</h1><span class="dim" id="who">MKSEC · phone</span></header>
<main>
 <div class="card"><div class="dim">hub status</div><pre id="status">…</pre></div>
 <div class="card"><div class="dim">crew chat — replies come back here</div><div id="chat">…</div></div>
 <div class="card"><div class="dim">last notes</div><pre id="notes">…</pre></div>
 <div class="card"><div class="dim">links</div>
   <div class="grid">
     <a href="https://bafoune.57.128.78.95.sslip.io/h" target="_blank" rel="noopener">HUB HARNESS</a>
     <a href="https://bafoune.57.128.78.95.sslip.io/alert" target="_blank" rel="noopener">ALERTS</a>
     <a href="https://bafoune.57.128.78.95.sslip.io/chat" target="_blank" rel="noopener">CHAT</a>
     <a href="https://bafoune.57.128.78.95.sslip.io/v2" target="_blank" rel="noopener">V.2</a>
     <a href="https://bafoune.57.128.78.95.sslip.io/bj" target="_blank" rel="noopener">BJ ADVISOR</a>
     <a href="https://chcdoladeepseekmksec.github.io/ang36283-site/" target="_blank" rel="noopener">RECORD</a>
   </div>
 </div>
</main>
<form onsubmit="send(event)"><input id="msg" placeholder="message to CHC…" autocomplete="off"><button>send</button></form>
<script>
const HUB = 'https://bafoune.57.128.78.95.sslip.io';
const WHO = 'ARCHIE33 (phone)';
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function txt(u){try{const r=await fetch(u,{cache:'no-store'});return await r.text()}catch(e){return 'offline: '+e}}
async function jsn(u){try{const r=await fetch(u,{cache:'no-store'});return await r.json()}catch(e){return {}}}
async function refresh(){
  document.getElementById('status').textContent=(await txt(HUB+'/status.json')).slice(0,500);
  document.getElementById('notes').textContent=(await txt(HUB+'/txt/notes')).slice(-1000);
  const d=await jsn(HUB+'/chat/feed?t='+Date.now());
  const box=document.getElementById('chat');
  const msgs=(d.messages||[]).slice(-14);
  box.innerHTML = msgs.map(m=>'<div class="msg"><div class="w">'+esc(m.who)+'</div><div class="t">'+esc(m.text)+'</div></div>').join('') || '<div class="dim">no messages yet — say hello</div>';
}
async function send(ev){
  ev.preventDefault();
  const i=document.getElementById('msg'); const m=i.value.trim(); if(!m) return; i.value='';
  try{
    const r=await fetch(HUB+'/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({who:WHO,text:m})});
    if(!r.ok) throw new Error('http '+r.status);
    setTimeout(refresh,500);
  }catch(e){ alert('send failed: '+e+' — try the hub harness link'); }
}
refresh(); setInterval(refresh,12000);
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
